[project]
name = "nft-generator"
version = "0.1.0"
description = "Django REST service for minting and querying ERC-721 NFTs on Ethereum (Sepolia testnet)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15,<4",
    "drf-yasg>=1.21,<2",
    "web3>=7.1,<8",
    "psycopg2-binary>=2.9,<3",
    "gunicorn>=21.2,<27",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["nft_generator", "tokens"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = "."
exclude = ["migrations/"]
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "drf_yasg.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "nft_generator.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "nft_generator.settings"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.uv]
package = false
